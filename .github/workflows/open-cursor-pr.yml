name: Open cursor branch PR

on:
  push:
    branches:
      - "cursor/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request when missing
        uses: actions/github-script@v7
        with:
          script: |
            const head = context.ref.replace("refs/heads/", "");
            const { owner, repo } = context.repo;
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${head}`,
              state: "open",
            });
            if (existing.data.length > 0) {
              core.info(`Open PR already exists: ${existing.data[0].html_url}`);
              return;
            }

            const commits = await github.rest.repos.listCommits({
              owner,
              repo,
              sha: head,
              per_page: 1,
            });
            const message = commits.data[0]?.commit?.message ?? head;
            const title = message.split("\n")[0].trim() || head;
            const body = [
              message,
              "",
              `Auto-opened for branch \`${head}\`.`,
            ].join("\n");

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head,
              base: "main",
              body,
            });
            core.info(`Created PR: ${pr.data.html_url}`);
